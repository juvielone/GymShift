<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#FFFFFF;color:#111111;font-family:Geist,sans-serif;font-size:16px;position:relative;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.word{font:700 15px/1 Geist;letter-spacing:.08em;text-transform:uppercase}
.av{width:36px;height:36px;border-radius:50%;background:#F4F4F5;display:flex;align-items:center;justify-content:center;font:600 15px/1 Geist}
.hi{padding:6px 20px 0}
.hi h1{font:600 26px/1.2 Geist;letter-spacing:-.01em}
.seg{margin:18px 16px 0;background:#F4F4F5;border-radius:12px;padding:4px;display:grid;grid-template-columns:1fr 1fr}
.seg span{height:40px;display:flex;align-items:center;justify-content:center;font:500 15px/1 Geist;color:#52525B;border-radius:9px}
.seg .on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sec{padding:26px 20px 0}
.lbl{display:flex;justify-content:space-between;align-items:center}
.lbl p{font:500 15px/1 Geist;color:#52525B}
.chip{display:flex;align-items:center;gap:6px;background:#FEE2E2;color:#991B1B;font:600 13px/1 Geist;padding:6px 10px;border-radius:999px}
.chip i{width:7px;height:7px;border-radius:50%;background:#D7192A}
.sec h2{font:600 30px/1.1 Geist;letter-spacing:-.02em;margin-top:10px}
.big{margin-top:26px;display:flex;align-items:baseline;gap:10px}
.big b{font:600 56px/1 Geist;letter-spacing:-.03em}
.big span{font:400 16px/1 Geist;color:#52525B}
.line{position:relative;height:8px;border-radius:4px;background:#F4F4F5;margin-top:18px}
.fill{position:absolute;left:0;top:0;bottom:0;width:21%;border-radius:4px;background:#111}
.mark{position:absolute;left:85.7%;top:-5px;width:2px;height:18px;background:#111}
.zone{position:absolute;left:86.5%;right:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,#A1A1AA 0 3px,transparent 3px 6px);border-radius:0 4px 4px 0}
.legend{display:flex;justify-content:space-between;font:500 13px/1 Geist;color:#52525B;margin-top:10px}
.rows{margin:26px 16px 0;border-top:1px solid #E4E4E7}
.r{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #E4E4E7}
.ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 14px/1 Geist;flex:none}
.ok{background:#DCFCE7;color:#15803D}
.wait{background:#FEF3C7;color:#92400E}
.r p{font:500 16px/1.25 Geist}
.r em{display:block;font-style:normal;font:400 14px/1.3 Geist;color:#52525B}
.r .go{margin-left:auto;color:#71717A;font-size:18px}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:#fff}
.btn{height:58px;border-radius:14px;background:#D7192A;color:#fff;display:flex;align-items:center;justify-content:center;font:600 18px/1 Geist}
.note{text-align:center;font:400 13px/1.4 Geist;color:#52525B;margin-top:10px}
</style></head><body>
<div class="top"><span class="word">World Gym</span><span class="av">M</span></div>
<div class="hi"><h1>Hi Maria</h1></div>
<div class="seg"><span class="on">Today</span><span>Upcoming · 4</span></div>
<section class="sec">
  <div class="lbl"><p>Wed 28 Oct · Night shift</p><span class="chip"><i></i>On shift</span></div>
  <h2>7:00 – 10:00 pm</h2>
  <div class="big"><b>0:43</b><span>worked so far</span></div>
  <div class="line"><div class="fill"></div><div class="mark"></div><div class="zone"></div></div>
  <div class="legend"><span>In 6:57 pm</span><span>Finish 10:00 pm</span></div>
</section>
<div class="rows">
  <div class="r"><span class="ic ok">✓</span><div><p>At the gym</p><em>Saved when you clocked in</em></div></div>
  <div class="r"><span class="ic wait">+</span><div><p>Extra 20 min asked</p><em>Waiting for Carly</em></div><span class="go">›</span></div>
</div>
<div class="dock"><div class="btn">Clock out</div><p class="note">Your location is checked only when you tap.</p></div>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#FFFFFF;color:#111111;font-family:'Libre Franklin',sans-serif;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#111111;color:#fff}
.top b{font:800 14px/1 'Libre Franklin';letter-spacing:.08em;text-transform:uppercase}
.top span{font:600 15px/1 'Libre Franklin'}
.hi{padding:18px 20px 0;font:700 26px/1.15 'Libre Franklin'}
.card{margin:14px 16px 0;border:2px solid #111111;border-radius:10px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid #111111}
.ch b{font:800 22px/1.1 'Libre Franklin'}
.ch span{font:600 15px/1 'Libre Franklin'}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr}
.cols div{padding:12px 14px;border-right:1px solid #D6D6D6}
.cols div:last-child{border-right:0}
.cols small{display:block;font:700 12px/1 'Libre Franklin';letter-spacing:.12em;text-transform:uppercase;color:#555}
.stamp{display:inline-block;margin-top:8px;font:700 22px/1 'Courier Prime';color:#D7192A;border:2px solid #D7192A;padding:4px 6px;transform:rotate(-3deg)}
.empty{display:block;margin-top:10px;height:26px;border-bottom:2px dashed #999}
.cols b{display:block;margin-top:10px;font:800 22px/1 'Libre Franklin'}
.cta{margin:14px 16px 0;height:72px;background:#111111;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 24px/1 'Libre Franklin'}
.rows{margin:12px 16px 0;background:#F0F0F0;border-radius:10px}
.r{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #DDD}
.r:last-child{border-bottom:0}
.r p{font:600 16px/1.2 'Libre Franklin'}
.r em{font-style:normal;font:500 14px/1 'Libre Franklin'}
h2{margin:22px 20px 8px;font:800 14px/1 'Libre Franklin';letter-spacing:.1em;text-transform:uppercase}
table{margin:0 16px;width:calc(100% - 32px);border-collapse:collapse}
td{padding:12px 4px;border-top:1px solid #D6D6D6;font:500 16px/1 'Libre Franklin'}
td:last-child{text-align:right;font-weight:700}
</style></head><body>
<div class="top"><b>World Gym · Macquarie Park</b><span>Wed 28 Oct</span></div>
<p class="hi">Hi Maria, you're on the clock.</p>
<section class="card">
  <div class="ch"><b>Night shift</b><span>7:00 – 10:00 pm</span></div>
  <div class="cols">
    <div><small>In</small><span class="stamp">6:57 PM</span></div>
    <div><small>Out</small><span class="empty"></span></div>
    <div><small>Worked</small><b>43 min</b></div>
  </div>
</section>
<div class="cta">Clock out</div>
<div class="rows">
  <div class="r"><p>Location</p><em>At the gym</em></div>
  <div class="r"><p>Extra 20 min</p><em>Waiting for Carly</em></div>
</div>
<h2>Next shifts</h2>
<table>
  <tr><td>Sat 31 Oct</td><td>Morning</td><td>7:00 am</td></tr>
  <tr><td>Mon 2 Nov</td><td>Night</td><td>7:00 pm</td></tr>
  <tr><td>Thu 5 Nov</td><td>Morning</td><td>7:00 am</td></tr>
</table>
</body></html>

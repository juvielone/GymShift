<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#F3F4F6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.top{padding:20px 20px 0}
.top p{font-size:15px;color:#4B5563}
.top h1{font-size:26px;font-weight:700;margin-top:4px}
.card{margin:18px 16px 0;background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;justify-content:space-between;align-items:center}
.tag{background:#FDE7E9;color:#A50F1F;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.card h2{font-size:22px;font-weight:700;margin-top:8px}
.card .m{font-size:15px;color:#4B5563;margin-top:4px}
.ring{width:200px;height:200px;border-radius:50%;margin:22px auto 0;background:conic-gradient(#D7192A 0 24%,#E5E7EB 24% 100%);display:flex;align-items:center;justify-content:center}
.btn{width:172px;height:172px;border-radius:50%;background:#D7192A;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn b{font-size:24px}
.btn span{font-size:15px;margin-top:4px}
.line{display:flex;gap:10px;align-items:center;margin:16px 20px 0;font-size:15px;color:#374151}
.g{width:10px;height:10px;border-radius:50%;background:#16A34A}
.link{margin:10px 16px 0;background:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;font-size:16px}
.link span{color:#B45309;font-weight:600;font-size:14px}
h3{margin:22px 20px 8px;font-size:15px;color:#4B5563;font-weight:600}
.list{margin:0 16px;background:#fff;border-radius:12px}
.li{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #F3F4F6;font-size:16px}
.li i{font-style:normal;color:#4B5563}
</style></head><body>
<div class="top"><p>Wednesday, 28 October</p><h1>Hi, Maria</h1></div>
<div class="card">
  <div class="row"><span class="tag">Clocked in</span><span class="m">since 6:57 pm</span></div>
  <h2>Night shift</h2><p class="m">7:00 – 10:00 pm · World Gym Macquarie Park</p>
  <div class="ring"><div class="btn"><b>Clock out</b><span>0:43 worked</span></div></div>
</div>
<div class="line"><span class="g"></span>Location: at the gym</div>
<div class="link">Extra time: 20 min<span>Pending</span></div>
<h3>Upcoming</h3>
<div class="list">
  <div class="li">Sat 31 Oct<i>7:00 am</i></div>
  <div class="li">Mon 2 Nov<i>7:00 pm</i></div>
</div>
</body></html>

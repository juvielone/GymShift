<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#FFFFFF;color:#111111;font-family:Figtree,sans-serif;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E2E2E2}
.top b{font:800 15px/1 Figtree;letter-spacing:.06em;text-transform:uppercase}
.top span{font:600 15px/1 Figtree}
.hi{padding:18px 20px 0;font:700 26px/1.15 Figtree}
.block{margin:14px 16px 0;background:#111111;color:#fff;border-radius:12px;padding:16px 18px 18px;position:relative;overflow:hidden}
.block .k{display:flex;justify-content:space-between;align-items:center}
.k span{font:700 13px/1 Figtree;letter-spacing:.12em;text-transform:uppercase}
.moon{width:26px;height:26px;border-radius:50%;box-shadow:inset -7px -2px 0 0 #fff}
.block h1{font:800 38px/1.05 Figtree;margin-top:12px}
.block p{font:500 17px/1.3 Figtree;margin-top:6px;color:#E6E6E6}
.prog{margin-top:14px;height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.prog i{display:block;height:100%;width:24%;background:#fff;border-radius:5px}
.cta{margin:14px 16px 0;height:72px;background:#D7192A;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 24px/1 Figtree}
.st{margin:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s{background:#F0F0F0;border-radius:12px;padding:12px 14px}
.s p{font:700 16px/1.2 Figtree}
.s em{font-style:normal;font:500 14px/1.3 Figtree;color:#444}
h2{margin:22px 20px 10px;font:800 14px/1 Figtree;letter-spacing:.1em;text-transform:uppercase}
.wk{margin:0 16px;display:grid;gap:8px}
.c{display:grid;grid-template-columns:62px 1fr auto;align-items:center;border-radius:12px;padding:12px 14px}
.am{background:#fff;color:#111;box-shadow:inset 0 0 0 3px #D7192A}
.pm{background:#111111;color:#fff}
.c b{font:800 22px/1 Figtree}
.c small{display:block;font:600 13px/1.2 Figtree;text-transform:uppercase;letter-spacing:.06em}
.c p{font:700 17px/1.2 Figtree}
.c span{font:700 16px/1 Figtree}
</style></head><body>
<div class="top"><b>World Gym</b><span>Wed 28 Oct</span></div>
<p class="hi">Hi Maria, you're clocked in.</p>
<section class="block">
  <div class="k"><span>Night shift · now</span><span class="moon"></span></div>
  <h1>7:00 – 10:00 pm</h1>
  <p>In at 6:57 pm · 43 min worked</p>
  <div class="prog"><i></i></div>
</section>
<div class="cta">Clock out</div>
<div class="st">
  <div class="s"><p>At the gym</p><em>Location saved</em></div>
  <div class="s"><p>Extra 20 min</p><em>Waiting for Carly</em></div>
</div>
<h2>Next shifts</h2>
<div class="wk">
  <div class="c am"><div><small>Sat</small><b>31</b></div><p>Morning</p><span>7:00 am</span></div>
  <div class="c pm"><div><small>Mon</small><b>2</b></div><p>Night</p><span>7:00 pm</span></div>
  <div class="c am"><div><small>Thu</small><b>5</b></div><p>Morning</p><span>7:00 am</span></div>
</div>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#000;color:#fff;font-family:'Noto Sans',sans-serif}
.top{padding:18px 20px 0;font:600 14px/1 'Noto Sans';letter-spacing:.04em;opacity:.85}
.big{padding:8px 0 0 16px;font:300 76px/.95 'Noto Sans';letter-spacing:-.03em;white-space:nowrap}
.meta{padding:10px 20px 0;font:400 18px/1.3 'Noto Sans'}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:20px 20px 0}
.t{padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.wide{grid-column:span 2;min-height:150px;background:#A4C400;color:#000}
.wide b{font:300 52px/1 'Noto Sans';letter-spacing:-.02em}
.wide span{font:600 15px/1.2 'Noto Sans'}
.blue{background:#1BA1E2;color:#000}
.amber{background:#F0A30A;color:#000}
.t b{font:600 18px/1.2 'Noto Sans'}
.t span{font:400 15px/1.3 'Noto Sans'}
h2{padding:24px 20px 8px;font:300 32px/1 'Noto Sans';letter-spacing:-.01em}
.list{padding:0 20px}
.r{display:flex;justify-content:space-between;padding:10px 0;font:400 18px/1.2 'Noto Sans'}
.r i{font-style:normal;opacity:.7}
</style></head><body>
<p class="top">WORLD GYM · WED 28 OCT</p>
<p class="big">night shift</p>
<p class="meta">Hi Maria · 7:00 – 10:00 pm · 43 min in</p>
<div class="grid">
  <div class="t wide"><b>clock out</b><span>Tap once. Your time is saved.</span></div>
  <div class="t blue"><b>at the gym</b><span>30 m away</span></div>
  <div class="t amber"><b>extra 20 min</b><span>waiting for Carly</span></div>
</div>
<h2>next shifts</h2>
<div class="list">
  <div class="r"><span>Sat 31 Oct</span><i>morning 7:00 am</i></div>
  <div class="r"><span>Mon 2 Nov</span><i>night 7:00 pm</i></div>
  <div class="r"><span>Thu 5 Nov</span><i>morning 7:00 am</i></div>
  <div class="r"><span>Sat 7 Nov</span><i>night 7:00 pm</i></div>
</div>
</body></html>
